<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Her Books — Library & Wishlist</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: '#faf7f2',
            ink: '#2c2416',
            accent: '#8b5e3c',
            soft: '#e8dfd0',
            sage: '#6b7c5a',
          },
          fontFamily: {
            serif: ['Georgia', 'Cambria', 'Times New Roman', 'serif'],
            sans: ['system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body { background: linear-gradient(160deg, #faf7f2 0%, #f0e9dc 100%); min-height: 100vh; }
    .book-card { transition: transform 0.15s ease, box-shadow 0.15s ease; }
    .book-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(44,36,22,0.12); }
    .tab-active { border-bottom: 3px solid #8b5e3c; color: #8b5e3c; font-weight: 600; }
    .modal-backdrop { background: rgba(44,36,22,0.45); backdrop-filter: blur(4px); }
    input:focus, select:focus, textarea:focus { outline: 2px solid #8b5e3c; outline-offset: 1px; }
    .badge-owned { background: #d4e5c5; color: #3d5a2c; }
    .badge-wishlist { background: #f5e0c3; color: #7a4f1e; }
    .badge-reading { background: #c5d9e8; color: #1e4a6b; }
    .empty-state { opacity: 0.7; }
  </style>
</head>
<body class="font-sans text-ink antialiased">
  <div class="max-w-5xl mx-auto px-4 py-8 sm:px-6">

    <!-- Header -->
    <header class="mb-8 text-center sm:text-left">
      <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-4">
        <div>
          <h1 class="font-serif text-3xl sm:text-4xl tracking-tight text-ink">Her Books</h1>
          <p class="text-ink/60 mt-1 text-sm sm:text-base">Library · Wishlist · Reading tracker</p>
        </div>
        <div class="flex gap-2 justify-center sm:justify-end">
          <button onclick="exportData()" class="text-sm px-3 py-1.5 rounded-lg border border-soft bg-white/60 hover:bg-white text-ink/70 transition">
            Export
          </button>
          <label class="text-sm px-3 py-1.5 rounded-lg border border-soft bg-white/60 hover:bg-white text-ink/70 transition cursor-pointer">
            Import
            <input type="file" accept=".json" class="hidden" onchange="importData(event)" />
          </label>
        </div>
      </div>
    </header>

    <!-- Stats -->
    <div class="grid grid-cols-3 gap-3 mb-6">
      <div class="bg-white/70 rounded-xl p-4 border border-soft/80 text-center">
        <div class="text-2xl font-serif text-accent" id="stat-owned">0</div>
        <div class="text-xs text-ink/50 mt-0.5">Owned</div>
      </div>
      <div class="bg-white/70 rounded-xl p-4 border border-soft/80 text-center">
        <div class="text-2xl font-serif text-accent" id="stat-wishlist">0</div>
        <div class="text-xs text-ink/50 mt-0.5">Wishlist</div>
      </div>
      <div class="bg-white/70 rounded-xl p-4 border border-soft/80 text-center">
        <div class="text-2xl font-serif text-accent" id="stat-reading">0</div>
        <div class="text-xs text-ink/50 mt-0.5">Reading</div>
      </div>
    </div>

    <!-- Tabs + Search + Add -->
    <div class="flex flex-col sm:flex-row sm:items-center gap-3 mb-5">
      <div class="flex gap-1 border-b border-soft">
        <button data-tab="owned" class="tab-btn tab-active px-4 py-2 text-sm transition" onclick="switchTab('owned')">Owned</button>
        <button data-tab="wishlist" class="tab-btn px-4 py-2 text-sm text-ink/50 transition" onclick="switchTab('wishlist')">Wishlist</button>
        <button data-tab="all" class="tab-btn px-4 py-2 text-sm text-ink/50 transition" onclick="switchTab('all')">All</button>
      </div>
      <div class="flex-1 flex gap-2">
        <input id="search" type="search" placeholder="Search title, author, notes…" 
               class="flex-1 rounded-lg border border-soft bg-white/80 px-3 py-2 text-sm"
               oninput="render()" />
        <button onclick="openModal()" 
                class="bg-accent text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-accent/90 transition whitespace-nowrap">
          + Add book
        </button>
      </div>
    </div>

    <!-- Filters -->
    <div class="flex flex-wrap gap-2 mb-5 text-sm">
      <select id="filter-status" onchange="render()" class="rounded-lg border border-soft bg-white/80 px-2 py-1.5 text-sm">
        <option value="">All statuses</option>
        <option value="owned">Owned</option>
        <option value="wishlist">Wishlist</option>
        <option value="reading">Currently reading</option>
        <option value="read">Finished</option>
      </select>
      <select id="filter-genre" onchange="render()" class="rounded-lg border border-soft bg-white/80 px-2 py-1.5 text-sm">
        <option value="">All genres</option>
      </select>
      <select id="sort-by" onchange="render()" class="rounded-lg border border-soft bg-white/80 px-2 py-1.5 text-sm">
        <option value="added-desc">Newest first</option>
        <option value="added-asc">Oldest first</option>
        <option value="title">Title A–Z</option>
        <option value="author">Author A–Z</option>
        <option value="priority">Priority (wishlist)</option>
      </select>
    </div>

    <!-- Book list -->
    <div id="book-list" class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3"></div>
    <div id="empty" class="hidden empty-state text-center py-16 text-ink/50">
      <div class="text-5xl mb-3">📚</div>
      <p class="font-serif text-lg">No books yet</p>
      <p class="text-sm mt-1">Add the first one with the button above</p>
    </div>

  </div>

  <!-- Modal -->
  <div id="modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop">
    <div class="bg-cream rounded-2xl shadow-xl w-full max-w-md max-h-[90vh] overflow-y-auto border border-soft">
      <div class="p-5 border-b border-soft flex justify-between items-center sticky top-0 bg-cream z-10">
        <h2 id="modal-title" class="font-serif text-xl">Add book</h2>
        <button onclick="closeModal()" class="text-ink/40 hover:text-ink text-2xl leading-none">&times;</button>
      </div>
      <form id="book-form" class="p-5 space-y-4" onsubmit="saveBook(event)">
        <input type="hidden" id="book-id" />
        <div>
          <label class="block text-xs font-medium text-ink/60 mb-1">Title *</label>
          <input id="title" required class="w-full rounded-lg border border-soft bg-white px-3 py-2 text-sm" placeholder="The Name of the Rose" />
        </div>
        <div>
          <label class="block text-xs font-medium text-ink/60 mb-1">Author</label>
          <input id="author" class="w-full rounded-lg border border-soft bg-white px-3 py-2 text-sm" placeholder="Umberto Eco" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-ink/60 mb-1">Status *</label>
            <select id="status" required class="w-full rounded-lg border border-soft bg-white px-3 py-2 text-sm">
              <option value="owned">Owned</option>
              <option value="wishlist">Wishlist</option>
              <option value="reading">Currently reading</option>
              <option value="read">Finished</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-ink/60 mb-1">Genre</label>
            <input id="genre" list="genre-list" class="w-full rounded-lg border border-soft bg-white px-3 py-2 text-sm" placeholder="Fiction" />
            <datalist id="genre-list"></datalist>
          </div>
        </div>
        <div id="priority-wrap" class="hidden">
          <label class="block text-xs font-medium text-ink/60 mb-1">Wishlist priority</label>
          <select id="priority" class="w-full rounded-lg border border-soft bg-white px-3 py-2 text-sm">
            <option value="3">High</option>
            <option value="2" selected>Medium</option>
            <option value="1">Low</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-ink/60 mb-1">Notes / why she wants it</label>
          <textarea id="notes" rows="2" class="w-full rounded-lg border border-soft bg-white px-3 py-2 text-sm" placeholder="Recommended by…"></textarea>
        </div>
        <div>
          <label class="block text-xs font-medium text-ink/60 mb-1">Link (optional)</label>
          <input id="link" type="url" class="w-full rounded-lg border border-soft bg-white px-3 py-2 text-sm" placeholder="https://…" />
        </div>
        <div class="flex gap-2 pt-2">
          <button type="submit" class="flex-1 bg-accent text-white py-2.5 rounded-lg text-sm font-medium hover:bg-accent/90 transition">
            Save
          </button>
          <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-lg border border-soft text-sm text-ink/70 hover:bg-white/50 transition">
            Cancel
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-ink text-cream px-4 py-2.5 rounded-full text-sm shadow-lg z-50"></div>

  <script>
    const STORAGE_KEY = 'her-books-v1';
    let books = [];
    let currentTab = 'owned';
    let editingId = null;

    // ——— Persistence ———
    function load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        books = raw ? JSON.parse(raw) : [];
      } catch {
        books = [];
      }
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(books));
    }

    // ——— Helpers ———
    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    }

    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 2200);
    }

    function statusLabel(s) {
      return { owned: 'Owned', wishlist: 'Wishlist', reading: 'Reading', read: 'Finished' }[s] || s;
    }

    function statusBadge(s) {
      const map = { owned: 'badge-owned', wishlist: 'badge-wishlist', reading: 'badge-reading', read: 'badge-owned' };
      return map[s] || 'badge-owned';
    }

    function priorityLabel(p) {
      return { 3: 'High', 2: 'Medium', 1: 'Low' }[p] || '';
    }

    // ——— Tabs ———
    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        const active = btn.dataset.tab === tab;
        btn.classList.toggle('tab-active', active);
        btn.classList.toggle('text-ink/50', !active);
      });
      // Sync status filter when switching main tabs
      const statusSel = document.getElementById('filter-status');
      if (tab === 'owned') statusSel.value = 'owned';
      else if (tab === 'wishlist') statusSel.value = 'wishlist';
      else statusSel.value = '';
      render();
    }

    // ——— Modal ———
    function openModal(id = null) {
      editingId = id;
      const form = document.getElementById('book-form');
      form.reset();
      document.getElementById('book-id').value = '';
      document.getElementById('modal-title').textContent = id ? 'Edit book' : 'Add book';
      document.getElementById('priority-wrap').classList.add('hidden');

      if (id) {
        const b = books.find(x => x.id === id);
        if (b) {
          document.getElementById('book-id').value = b.id;
          document.getElementById('title').value = b.title || '';
          document.getElementById('author').value = b.author || '';
          document.getElementById('status').value = b.status || 'owned';
          document.getElementById('genre').value = b.genre || '';
          document.getElementById('priority').value = b.priority || 2;
          document.getElementById('notes').value = b.notes || '';
          document.getElementById('link').value = b.link || '';
          togglePriority();
        }
      }
      document.getElementById('modal').classList.remove('hidden');
      document.getElementById('title').focus();
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
      editingId = null;
    }

    document.getElementById('status').addEventListener('change', togglePriority);
    function togglePriority() {
      const show = document.getElementById('status').value === 'wishlist';
      document.getElementById('priority-wrap').classList.toggle('hidden', !show);
    }

    // ——— CRUD ———
    function saveBook(e) {
      e.preventDefault();
      const id = document.getElementById('book-id').value || uid();
      const existing = books.find(b => b.id === id);
      const book = {
        id,
        title: document.getElementById('title').value.trim(),
        author: document.getElementById('author').value.trim(),
        status: document.getElementById('status').value,
        genre: document.getElementById('genre').value.trim(),
        priority: Number(document.getElementById('priority').value) || 2,
        notes: document.getElementById('notes').value.trim(),
        link: document.getElementById('link').value.trim(),
        added: existing ? existing.added : Date.now(),
        updated: Date.now(),
      };
      if (existing) {
        Object.assign(existing, book);
        toast('Updated');
      } else {
        books.unshift(book);
        toast('Added');
      }
      save();
      closeModal();
      render();
    }

    function deleteBook(id) {
      if (!confirm('Remove this book?')) return;
      books = books.filter(b => b.id !== id);
      save();
      toast('Removed');
      render();
    }

    function moveToOwned(id) {
      const b = books.find(x => x.id === id);
      if (b) {
        b.status = 'owned';
        b.updated = Date.now();
        save();
        toast('Moved to owned');
        render();
      }
    }

    function setReading(id) {
      const b = books.find(x => x.id === id);
      if (b) {
        b.status = 'reading';
        b.updated = Date.now();
        save();
        toast('Marked as reading');
        render();
      }
    }

    // ——— Render ———
    function updateStats() {
      document.getElementById('stat-owned').textContent = books.filter(b => b.status === 'owned' || b.status === 'read' || b.status === 'reading').length;
      document.getElementById('stat-wishlist').textContent = books.filter(b => b.status === 'wishlist').length;
      document.getElementById('stat-reading').textContent = books.filter(b => b.status === 'reading').length;
    }

    function updateGenreFilter() {
      const genres = [...new Set(books.map(b => b.genre).filter(Boolean))].sort();
      const sel = document.getElementById('filter-genre');
      const current = sel.value;
      sel.innerHTML = '<option value="">All genres</option>' + genres.map(g => `<option value="${g}">${g}</option>`).join('');
      sel.value = current;
      // Also refresh datalist
      document.getElementById('genre-list').innerHTML = genres.map(g => `<option value="${g}">`).join('');
    }

    function render() {
      updateStats();
      updateGenreFilter();

      const q = document.getElementById('search').value.toLowerCase().trim();
      const statusF = document.getElementById('filter-status').value;
      const genreF = document.getElementById('filter-genre').value;
      const sort = document.getElementById('sort-by').value;

      let list = books.filter(b => {
        if (statusF && b.status !== statusF) return false;
        if (genreF && b.genre !== genreF) return false;
        if (q) {
          const hay = `${b.title} ${b.author} ${b.notes} ${b.genre}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      // Sort
      list.sort((a, b) => {
        if (sort === 'title') return (a.title || '').localeCompare(b.title || '');
        if (sort === 'author') return (a.author || '').localeCompare(b.author || '');
        if (sort === 'priority') return (b.priority || 0) - (a.priority || 0);
        if (sort === 'added-asc') return (a.added || 0) - (b.added || 0);
        return (b.added || 0) - (a.added || 0); // newest first
      });

      const container = document.getElementById('book-list');
      const empty = document.getElementById('empty');

      if (list.length === 0) {
        container.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');

      container.innerHTML = list.map(b => `
        <article class="book-card bg-white/80 rounded-xl border border-soft/80 p-4 flex flex-col">
          <div class="flex items-start justify-between gap-2 mb-2">
            <span class="text-xs px-2 py-0.5 rounded-full ${statusBadge(b.status)}">${statusLabel(b.status)}</span>
            ${b.status === 'wishlist' && b.priority ? `<span class="text-xs text-ink/40">${priorityLabel(b.priority)} priority</span>` : ''}
          </div>
          <h3 class="font-serif text-lg leading-snug text-ink">${escapeHtml(b.title)}</h3>
          ${b.author ? `<p class="text-sm text-ink/60 mt-0.5">${escapeHtml(b.author)}</p>` : ''}
          ${b.genre ? `<p class="text-xs text-ink/40 mt-1">${escapeHtml(b.genre)}</p>` : ''}
          ${b.notes ? `<p class="text-sm text-ink/55 mt-2 line-clamp-2">${escapeHtml(b.notes)}</p>` : ''}
          <div class="mt-auto pt-3 flex flex-wrap gap-1.5">
            ${b.link ? `<a href="${escapeAttr(b.link)}" target="_blank" rel="noopener" class="text-xs px-2 py-1 rounded bg-soft/60 hover:bg-soft text-ink/70">Link</a>` : ''}
            <button onclick="openModal('${b.id}')" class="text-xs px-2 py-1 rounded bg-soft/60 hover:bg-soft text-ink/70">Edit</button>
            ${b.status === 'wishlist' ? `<button onclick="moveToOwned('${b.id}')" class="text-xs px-2 py-1 rounded bg-sage/20 hover:bg-sage/30 text-sage">Got it!</button>` : ''}
            ${b.status === 'owned' ? `<button onclick="setReading('${b.id}')" class="text-xs px-2 py-1 rounded bg-blue-100 hover:bg-blue-200 text-blue-800">Reading</button>` : ''}
            <button onclick="deleteBook('${b.id}')" class="text-xs px-2 py-1 rounded text-red-600/70 hover:bg-red-50 ml-auto">Delete</button>
          </div>
        </article>
      `).join('');
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
    function escapeAttr(str) {
      return escapeHtml(str).replace(/'/g, '&#39;');
    }

    // ——— Import / Export ———
    function exportData() {
      const blob = new Blob([JSON.stringify(books, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `her-books-${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(a.href);
      toast('Exported');
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          if (!Array.isArray(data)) throw new Error('Invalid format');
          if (!confirm(`Import ${data.length} books? This replaces your current list.`)) return;
          books = data;
          save();
          render();
          toast('Imported');
        } catch {
          alert('Could not read that file. Make sure it is a valid export.');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    }

    // ——— Init ———
    load();
    // Default tab filter
    document.getElementById('filter-status').value = 'owned';
    render();

    // Close modal on backdrop click
    document.getElementById('modal').addEventListener('click', e => {
      if (e.target.id === 'modal') closeModal();
    });
    // Escape key
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModal();
    });
  </script>
</body>
</html>
